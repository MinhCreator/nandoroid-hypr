id = "nandoroid/hypr-tools"
name = "NAnDoroid Hypr Tools"
version = "1.0.0"
plugin_api = 26
author = "nandoroid"
license = "MIT"
description = "Port of NAnDoroid Hyprland settings + Keybinds: workspace grid overview, Hyprland visual/layout/input/animations/autostart forms, keybind CRUD."
tags = ["hyprland", "keybinds"]
dependencies = ["hyprctl", "python3"]

# ── Shared plugin settings (seeded into every entry) ──
[[setting]]
key = "python_bin"
type = "string"
label_key = "settings.python_bin.label"
description_key = "settings.python_bin.description"
default = "python3"

# ── Override dir for hypr settings ──
[[setting]]
key = "override_dir"
type = "string"
label_key = "settings.override_dir.label"
description_key = "settings.override_dir.description"
default = "~/.config/hypr/nandoroid"

[[setting]]
key = "hypr_config_dir"
type = "string"
label_key = "settings.hypr_config_dir.label"
description_key = "settings.hypr_config_dir.description"
default = "~/.config/hypr"

[[setting]]
key = "keybind_override"
type = "string"
label_key = "settings.keybind_override.label"
description_key = "settings.keybind_override.description"
default = ""

[[setting]]
key = "poll_ms"
type = "int"
label_key = "settings.poll_ms.label"
description_key = "settings.poll_ms.description"
default = 1500
min = 500
max = 10000

# ── Background poller: hyprctl + keybinds → noctalia.state ──
[[service]]
id = "hypr-sync"
entry = "service.luau"

# ── Hyprland settings + keybinds panel (port of addon/Hyprland + addon/keybindSetting) ──
[[panel]]
id = "hypr-tools"
entry = "hypr_tools.luau"
width = 600
height = 800
placement = "floating"
position = "center"
keyboard_focus = "on_demand"

  [[panel.setting]]
  key = "default_tab"
  type = "select"
  label_key = "settings.default_tab.label"
  default = "Visual"
  options = [
    { value = "Visual", label_key = "settings.default_tab.visual" },
    { value = "Layout", label_key = "settings.default_tab.layout" },
    { value = "Input", label_key = "settings.default_tab.input" },
    { value = "Animations", label_key = "settings.default_tab.animations" },
    { value = "Autostart", label_key = "settings.default_tab.autostart" },
    { value = "Keybinds", label_key = "settings.default_tab.keybinds" },
  ]
